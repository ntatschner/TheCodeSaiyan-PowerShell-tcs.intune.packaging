name: Bug report
description: Something in tcs.intune.packaging does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: tcs.intune.packaging version
      description: Output of `(Get-Module tcs.intune.packaging).Version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `$PSVersionTable` and your operating system.
      render: text
    validations:
      required: true
